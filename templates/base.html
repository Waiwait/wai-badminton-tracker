<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    {% load static %}

    <link rel="stylesheet" href="{% static 'css/styles.css' %}">

    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'images/favicon/apple-touch-icon.png' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/favicon/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'images/favicon/favicon-16x16.png' %}">
    <link rel="manifest" href="{% static 'images/favicon/site.webmanifest' %}">

    <title>{% block title %}Match App{% endblock %}</title>
</head>

<body>

    <div id="toast-container"
         class="fixed top-5 right-5 z-50 space-y-3">
    </div>


    {% block content %}
    {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script>
        document.body.addEventListener('htmx:configRequest', function (event) {
            event.detail.headers['X-CSRFToken'] = '{{ csrf_token }}';
        });
    </script>

    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js"></script>


    <script>
    document.body.addEventListener("showToast", function(event) {
        const data = event.detail;

        const toast = document.createElement("div");

        toast.className =
            "bg-[#203A43] text-white px-4 py-3 rounded-lg shadow-lg border border-[#0F2027] transition-opacity duration-500";

        toast.innerText = data.message;

        document.getElementById("toast-container").appendChild(toast);

        setTimeout(() => {
            toast.classList.add("opacity-0");

            setTimeout(() => {
                toast.remove();
            }, 500);

        }, 3000);
    });
    </script>


    <script src="{% static 'js/index.js' %}"></script>

    <script>
        function initMatchTimers(root = document) {
            const timers = root.querySelectorAll("[data-match-timer]");

            timers.forEach(timerEl => {

                if (timerEl._interval) {
                    clearInterval(timerEl._interval);
                }

                let seconds = parseInt(timerEl.dataset.seconds || "0");

                function format(sec) {
                    const m = Math.floor(sec / 60);
                    const s = sec % 60;

                    return (
                        String(m).padStart(2, "0") + ":" +
                        String(s).padStart(2, "0")
                    );
                }

                function tick() {
                    seconds++;
                    timerEl.innerText = format(seconds);
                }

                // initial render (important!)
                timerEl.innerText = format(seconds);

                timerEl._interval = setInterval(tick, 1000);
            });
        }

        document.addEventListener("DOMContentLoaded", () => initMatchTimers());

        document.body.addEventListener("htmx:afterSwap", (e) => {
            initMatchTimers(e.target);
        });
        </script>
</body>
</html>

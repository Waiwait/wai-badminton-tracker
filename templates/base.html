<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    {% load static %}

    <link rel="stylesheet" href="{% static 'css/styles.css' %}">

    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'images/favicon/apple-touch-icon.png' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/favicon/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'images/favicon/favicon-16x16.png' %}">
    <link rel="manifest" href="{% static 'images/favicon/site.webmanifest' %}">

    <title>{% block title %}Match App{% endblock %}</title>
</head>

<body>

    {% block content %}
    {% endblock %}

    <!-- Tailwind via CDN Play -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        document.body.addEventListener('htmx:configRequest', function (event) {
            event.detail.headers['X-CSRFToken'] = '{{ csrf_token }}';
        });
        </script>

    <!-- HTMX (required for hx-get, hx-trigger, etc.) -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js"></script>

    <script src="{% static 'js/index.js' %}"></script>

    <script>
        function initMatchTimers(root = document) {
            const timers = root.querySelectorAll("[data-match-timer]");

            timers.forEach(timerEl => {

                if (timerEl._interval) {
                    clearInterval(timerEl._interval);
                }

                let seconds = parseInt(timerEl.dataset.seconds || "0");

                function format(sec) {
                    const m = Math.floor(sec / 60);
                    const s = sec % 60;

                    return (
                        String(m).padStart(2, "0") + ":" +
                        String(s).padStart(2, "0")
                    );
                }

                function tick() {
                    seconds++;
                    timerEl.innerText = format(seconds);
                }

                // initial render (important!)
                timerEl.innerText = format(seconds);

                timerEl._interval = setInterval(tick, 1000);
            });
        }

        document.addEventListener("DOMContentLoaded", () => initMatchTimers());

        document.body.addEventListener("htmx:afterSwap", (e) => {
            initMatchTimers(e.target);
        });
        </script>
</body>
</html>

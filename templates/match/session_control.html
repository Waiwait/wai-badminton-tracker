<h2>Session Control</h2>

<div style="display: flex; gap: 40px;">

  <!-- LEFT: Available players -->
  <div>
    <h3>Add Players</h3>

    <form method="GET">
      <input type="text" name="q" placeholder="Search players..." value="{{ query }}">
      <button type="submit">Search</button>
    </form>

    {% for player in available_players %}
      <div>
        {{ player.name }}
        <form method="POST" action="{% url "add_player" session.uuid %}">
          {% csrf_token %}
          <input type="hidden" name="player_id" value="{{ player.id }}">
          <button>Add</button>
        </form>
      </div>
    {% endfor %}
  </div>

  <!-- RIGHT: Session players -->
  <div>
    <h3>Session Players</h3>

    {% for player in session_players %}
      <div>
        {{ player.name }}

        <form method="POST" action="{% url "remove_player" session.uuid player.id %}">
          {% csrf_token %}
          <button>Remove</button>
        </form>
      </div>
    {% endfor %}
  </div>

</div>

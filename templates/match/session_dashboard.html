{% extends "base.html" %}

{% block content %}

<h2>Live Court Board</h2>

<div
    class="board-container"
    hx-get="{% url 'court_board' uuid=session.uuid %}"
    hx-trigger="load, every 3s"
    hx-swap="innerHTML"
>
    Loading courts...
</div>

{% if show_admin_panel %}

  <div
    hx-get="{% url 'admin_dashboard' uuid=session.uuid %}"
    hx-trigger="load">
  </div>
{% endif %}

{% endblock %}

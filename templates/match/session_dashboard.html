{% extends "base.html" %}

{% block content %}

<div id="session-dashboard" class="container mx-auto p-4">
    <section>
        <div
            hx-get="{% url 'court_board' uuid=session.uuid %}"
            {% if show_admin_panel %}
                hx-trigger="load, every 60s, court_board_update from:body"
            {% else %}
                hx-trigger="load, every 10s"
            {% endif %}
            hx-swap="innerHTML"
        >
            Loading courts...
        </div>            
    </section>

     <section>
        <div
            hx-get="{% url 'session_history' uuid=session.uuid %}"
            {% if show_admin_panel %}
                hx-trigger="load, every 60s, history_update from:body"
            {% else %}
                hx-trigger="load, every 10s"
            {% endif %}
            hx-swap="innerHTML"
        >
            Loading history...
        </div>            
    </section>

    <section>
        {% if show_admin_panel %}
            {% include "match/partials/admin_dashboard.html" %}
        {% endif %}
    </section>

</div>
{% endblock %}

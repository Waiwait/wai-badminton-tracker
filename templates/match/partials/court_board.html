<div id="court-board" class="court-grid">
{% for item in court_data %}
  <div>
    <strong>Court {{ item.court.number }}</strong>

    {% if item.match %}
      <!-- Active Match - Show scoring form -->
      <div>
        {{ item.team1|join:", " }} | {{ item.team2|join:", " }}
      </div>

      {% if show_admin_panel %}
      <form method="post" 
            hx-post="{% url 'finish_match' uuid=session.uuid match_id=item.match.id %}"
            hx-target="#session-dashboard"
            hx-swap="outerHTML">

        <div style="margin: 10px 0;">
          <strong>Team 1:</strong>
          <input type="number" 
                 name="team1_score" 
                 min="0" 
                 max="30" 
                 value="{{ item.team1_score|default:0 }}"
                 required>
        </div>

        <div style="margin: 10px 0;">
          <strong>Team 2:</strong>
          <input type="number" 
                 name="team2_score" 
                 min="0" 
                 max="30" 
                 value="{{ item.team2_score|default:0 }}"
                 required>
        </div>

        <button type="submit">Finish Match</button>
      </form>
      {% endif %}

    {% else %}
      <!-- No match - Generate button -->
      {% if show_admin_panel %}
      <form method="post" 
            hx-post="{% url 'generate_match' uuid=session.uuid court_id=item.court.id %}"
            hx-target="#session-dashboard"
            hx-swap="outerHTML">
        <button type="submit">Generate Match</button>
      </form>
      {% else %}
        <div>Available</div>
      {% endif %}
    {% endif %}
  </div>
{% endfor %}
</div>


<h2 class="text-center font-bold mb-4">Waiting Players</h2>

<form
    hx-post="{% url 'add_player_to_session' uuid=session.uuid %}"
    hx-swap="none"
>
    {% csrf_token %}

    <select name="player_id" class="border rounded-sm p-2 w-full text-black">
        {% for player in players_not_in_session %}
            <option value="{{ player.id }}">
                {{ player.get_name }}
            </option>
        {% endfor %}
    </select>

    <button type="submit" class="primary-button mt-4 mb-6 w-full">
        Add Player
    </button>
</form>

<div id="admin-players" 
    class="space-y-2"
    hx-get="{% url 'waiting_players' session.uuid %}"
    hx-trigger="load, waiting_update from:body"
    hx-swap="innerHTML">

    Loading waiting players...
</div>

<div id="paused-list"
    class="space-y-2 mt-6"
    hx-get="{% url 'paused_players' session.uuid %}"
    hx-trigger="load, paused_update from:body"
    hx-swap="innerHTML">

    Loading paused players...
</div>

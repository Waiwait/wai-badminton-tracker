<h2 class="text-center font-bold mb-4">Pairs</h2>

<!-- Add New Pair Form -->
<form method="post" 
      hx-post="{% url 'add_pair' uuid=session.uuid %}" 
      hx-swap="none"
      class="w-full">

    <div class="flex justify-around gap-6">
        <!-- Player 1 -->
        <div class="flex-1">
            <label class="block text-sm font-medium mb-1">Player 1</label>
            <select name="p1_s_id" 
                    class="w-full text-(--dark-green) p-2 border rounded-sm" 
                    required>
                <option value="">Select Player 1</option>
                {% for ps in player_sessions_not_paired %}
                    <option value="{{ ps.id }}">
                        {{ ps.player.name }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <!-- Player 2 -->
        <div class="flex-1">
            <label class="block text-sm font-medium mb-1">Player 2</label>
            <select name="p2_s_id" 
                    class="w-full text-(--dark-green) p-2 border rounded-sm" 
                    required>
                <option value="">Select Player 2</option>
                {% for ps in player_sessions_not_paired %}
                    <option value="{{ ps.id }}">
                        {{ ps.player.name }}
                    </option>
                {% endfor %}
            </select>
        </div>
    </div>

    <button type="submit" class="primary-button mt-4 mb-6 w-full">
        Add Pair
    </button>
</form>

<div class="space-y-2">
    {% for pair in pairs %}
        <div class="flex justify-between items-center bg-gray-100 dark:bg-gray-800 p-3 rounded-sm">
            <div class="font-medium">
                {{ pair.get_name }}
            </div>
            
            <!-- Delete Button -->
            <form method="post" 
                  hx-post="{% url 'delete_pair' uuid=session.uuid pair_id=pair.id %}" 
                  hx-swap="none">
                {% csrf_token %}
                <button type="submit" 
                        class="text-red-600 hover:text-red-700 text-sm font-medium">
                    Delete
                </button>
            </form>
        </div>
    {% endfor %}
</div>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wai Badminton Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10/dist/htmx.min.js"></script>
    {% load static %}
</head>
<body class="bg-gray-50 font-sans">
    <nav class="bg-indigo-700 text-white p-4 shadow">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                🏸 Wai Badminton Tracker
            </h1>
            <div class="flex items-center gap-4">
                {% if user.is_authenticated %}
                    <span class="text-sm">Hi, {{ user.get_full_name|default:user.username }}</span>
                    <a href="{% url 'account_logout' %}" 
                       class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg text-sm">Logout</a>
                {% else %}
                    <a href="{% url 'account_login' %}" 
                       class="bg-white text-indigo-700 px-6 py-2 rounded-lg font-medium">Login with Google</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto p-6">
        {% block content %}{% endblock %}
    </div>
</body>
</html>

{% extends 'core/base.html' %}

{% block content %}
<h1 class="text-3xl font-bold mb-8">Start Match - Session {{ session.session_id }}</h1>

<form method="post" class="max-w-lg">
    {% csrf_token %}
    <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-2">Court Number</label>
        <input type="number" name="court" min="1" max="4" class="w-full border border-gray-300 rounded-2xl px-5 py-4" placeholder="1">
    </div>
    
    <div class="mb-8">
        <label class="block text-sm font-medium text-gray-700 mb-3">Select 4 Players</label>
        <div class="grid grid-cols-1 gap-3 max-h-96 overflow-auto">
            {% for player in players %}
            <label class="flex items-center gap-3 bg-white p-4 rounded-2xl border cursor-pointer hover:bg-gray-50">
                <input type="checkbox" name="players" value="{{ player.player.player_id }}" class="w-5 h-5 text-indigo-600">
                <span>{{ player.player.user.username }} (MMR: {{ player.player.MMR }})</span>
            </label>
            {% endfor %}
        </div>
    </div>
    
    <button type="submit" 
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-4 rounded-2xl text-lg font-semibold">
        Start Match
    </button>
</form>
{% endblock %}

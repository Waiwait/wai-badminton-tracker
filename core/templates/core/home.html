<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.10/dist/htmx.min.js"></script>
</head>
<body class="bg-gray-100">
    <div class="max-w-7xl mx-auto py-12 px-4">
        <div class="text-center">
            <h1 class="text-5xl font-bold text-green-600 mb-4">🏸 Wai Badminton Tracker</h1>
            <p class="text-xl text-gray-600 mb-8">Lightweight Multi-Club Badminton Session & Match Tracker</p>
            
            {% if user.is_authenticated %}
                <div class="bg-white rounded-xl shadow p-8">
                    <p class="text-lg">Welcome, {{ user.username }}!</p>
                    <a href="{% url 'account_logout' %}" 
                       class="mt-4 inline-block bg-red-500 hover:bg-red-600 text-white px-6 py-3 rounded-lg">
                        Logout
                    </a>
                </div>
            {% else %}
                <a href="{% url 'account_login' %}" 
                   class="inline-block bg-green-600 hover:bg-green-700 text-white px-8 py-4 rounded-xl text-xl font-medium">
                    Login with Google
                </a>
            {% endif %}
        </div>
    </div>
</body>
</html>

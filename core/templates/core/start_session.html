{% extends 'core/base.html' %}

{% block content %}
<h1 class="text-3xl font-bold mb-8">Start New Session - {{ club.name }}</h1>

<form method="post" class="max-w-md">
    {% csrf_token %}
    <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-2">Venue / Location</label>
        <input type="text" name="venue" class="w-full border border-gray-300 rounded-2xl px-5 py-4 focus:outline-none focus:border-indigo-500" placeholder="e.g. Community Centre Court 3">
    </div>
    
    <button type="submit" 
            class="w-full bg-green-600 hover:bg-green-700 text-white py-4 rounded-2xl text-lg font-semibold">
        Start Session
    </button>
</form>
{% endblock %}
